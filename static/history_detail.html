<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watched: Episodes details</title>
    <link rel="icon" type="image/webp" href="/static/watched_icon.webp" />
    <link rel="stylesheet" href="/static/styles.css?v=0.5.0" />
    <script>
        (() => {
            const pref = localStorage.getItem('theme-preference') || 'system';
            if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref);
        })();
    </script>
</head>

<body>
    <div id="bootLoading" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(120deg, rgba(9,13,23,.9), rgba(14,19,32,.9)); color:#e8eefc; z-index:9999; font-size:18px; gap:10px;">
        <span>⏳</span>
        <span id="bootLoadingText">Loading data…</span>
    </div>
    <header>
        <div class="header-left">
            <button id="backBtn" class="pill" type="button">← Back</button>
            <div class="brand">
                <img src="/static/watched_icon.webp" alt="" width="34" height="34" />
                <div>
                    <h1 id="seriesTitle">Serie</h1>
                    <div class="muted" id="seriesInfo"></div>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <div id="detailUserPill" class="pill">👤 —</div>
            <div class="lang-switcher" id="langSwitcher" role="group" aria-label="Language">
                <button type="button" class="lang-btn" data-lang="en">EN</button>
                <button type="button" class="lang-btn" data-lang="it">IT</button>
            </div>
            <div class="theme-switcher" id="themeSwitcher" role="group" aria-label="Theme">
                <button type="button" class="theme-btn" data-theme-value="system">System</button>
                <button type="button" class="theme-btn" data-theme-value="dark">Dark</button>
                <button type="button" class="theme-btn" data-theme-value="light">Light</button>
            </div>
        </div>
    </header>
    <main>
        <div id="seasons"></div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const userId = params.get('user') || '';
        const seriesId = params.get('seriesId') || '';
        const seriesName = params.get('seriesName') ? decodeURIComponent(params.get('seriesName')) : '';
        const userName = params.get('userName') ? decodeURIComponent(params.get('userName')) : '';
        let analyzedUserName = userName;

        let translations = {};
        let currentLang = localStorage.getItem('lang') || 'en';
        const THEME_KEY = 'theme-preference';
        let currentTheme = localStorage.getItem(THEME_KEY) || 'system';
        const bootLoading = document.getElementById('bootLoading');
        const bootLoadingText = document.getElementById('bootLoadingText');

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[c]));
        }

        function t(key, vars = {}) {
            const base = translations[key] || key;
            return Object.keys(vars).reduce((acc, k) => acc.replace(new RegExp(`{${k}}`, 'g'), vars[k]), base);
        }

        function episodeNoun(count) {
            return count === 1 ? t('label.episode.one') : t('label.episode.many');
        }

        async function resolveAnalyzedUserName() {
            if (!userId) return;
            if (analyzedUserName && analyzedUserName !== userId) return;
            try {
                const r = await fetch('/api/users', { cache: 'no-cache' });
                if (!r.ok) return;
                const data = await r.json();
                const users = Array.isArray(data.users) ? data.users : [];
                const match = users.find(u => String(u.user_id || '') === String(userId));
                if (match?.name) {
                    analyzedUserName = match.name;
                }
            } catch (e) {
                // Keep fallback to user id if user lookup fails.
            }
        }

        async function loadLang(lang) {
            currentLang = lang;
            try {
                const r = await fetch(`/static/locales/${lang}.json`);
                translations = await r.json();
            } catch (e) {
                translations = {};
            }
            if (bootLoadingText) bootLoadingText.textContent = t('loading') || 'Loading data…';
            localStorage.setItem('lang', lang);
            applyStaticText();
        }

        function applyStaticText() {
            document.title = t('title');
            document.getElementById('seriesTitle').textContent = seriesName || t('label.tvSeries');
            document.getElementById('backBtn').textContent = t('detail.back');
            updateLangSwitcher();
            updateThemeSwitcher();
            const analyzedUser = analyzedUserName || userId || '—';
            document.getElementById('detailUserPill').textContent = t('detail.analyzingUser', { user: analyzedUser });
        }

        document.getElementById('seriesTitle').textContent = seriesName || 'Series';

        function applyTheme(pref) {
            currentTheme = (pref === 'light' || pref === 'dark') ? pref : 'system';
            if (currentTheme === 'light' || currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', currentTheme);
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            localStorage.setItem(THEME_KEY, currentTheme);
            updateThemeSwitcher();
        }

        function updateThemeSwitcher() {
            document.querySelectorAll('[data-theme-value]').forEach(btn => {
                btn.classList.toggle('is-active', btn.dataset.themeValue === currentTheme);
            });
        }

        function updateLangSwitcher() {
            document.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
                btn.classList.toggle('is-active', btn.dataset.lang === currentLang);
            });
        }

        function goBack() {
            if (document.referrer && document.referrer.startsWith(window.location.origin)) {
                window.history.back();
                return;
            }
            window.location.href = '/';
        }

        async function loadDetail() {
            if (!userId || !seriesId) {
                document.getElementById('seriesInfo').textContent = t('detail.missingParams');
                return;
            }
            const res = await fetch(`/api/user/${encodeURIComponent(userId)}/history`);
            const data = await res.json();
            // Deduplicate episodes by episodeId/providerKey; keep latest date
            const raw = (data.items || []).filter(e => e.seriesId === seriesId);
            const byEp = new Map();
            raw.forEach(e => {
                const key = e.episodeId || e.ratingKey || e.providerKey || `${e.seriesId}:${e.seasonIndex}:${e.episodeIndex}:${e.title}`;
                const prev = byEp.get(key);
                if (!prev || (e.date || 0) > (prev.date || 0)) {
                    byEp.set(key, e);
                }
            });
            const epis = Array.from(byEp.values());
            if (epis.length === 0) {
                document.getElementById('seriesInfo').textContent = t('detail.noEpisodes');
                return;
            }
            const bySeason = {};
            epis.forEach(ep => {
                const key = ep.seasonName || `Season ${ep.seasonIndex || ''}` || 'Season';
                if (!bySeason[key]) bySeason[key] = [];
                bySeason[key].push(ep);
            });
            Object.values(bySeason).forEach(arr => {
                arr.sort((a,b) => (b.date || 0) - (a.date || 0));
            });
            const seasons = Object.entries(bySeason).sort((a,b) => {
                const la = a[1][0]?.date || 0;
                const lb = b[1][0]?.date || 0;
                return lb - la;
            });
            const container = document.getElementById('seasons');
            container.innerHTML = seasons.map(([name, eps]) => {
                const lastDate = eps.reduce((m,e) => Math.max(m, e.date || 0), 0);
                const lastDateStr = lastDate ? new Date(lastDate * 1000).toLocaleString() : '—';
                const epiHtml = eps.map(e => {
                    const code = (e.seasonIndex != null && e.episodeIndex != null)
                        ? `S${String(e.seasonIndex).padStart(2,'0')}E${String(e.episodeIndex).padStart(2,'0')}`
                        : '';
                    const when = e.date ? new Date(e.date * 1000).toLocaleString() : '—';
                    const coverSrc = e.thumb || e.jellyfinThumb || '';
                    const cover = coverSrc
                        ? `<img src="${escapeHtml(coverSrc)}" alt="">`
                        : `<span class="muted">${escapeHtml(t('label.noPoster'))}</span>`;
                    const epTitle = (e.title && e.title !== seriesName) ? e.title : (e.episodeTitle || '');
                    const seasonLabel = e.seasonName || '';
                    return `<div class="episode">
                        <div class="episode-cover">${cover}</div>
                        <div style="flex:1 1 auto;">
                            <div class="epi-title">${escapeHtml(code ? code + ' · ' : '')}${escapeHtml(epTitle)}</div>
                            <div class="epi-sub">${escapeHtml(seasonLabel)}</div>
                        </div>
                        <div class="episode-viewed">${t('detail.viewed')}: ${escapeHtml(when)}</div>
                    </div>`;
                }).join('');
                return `<div class="season-block">
                    <div class="season-head">
                        <div class="epi-title section-title" style="padding-top:0;">${escapeHtml(name)}</div>
                        <div class="season-meta-row">
                            <div class="epi-sub">${t('detail.lastViewed')}: ${escapeHtml(lastDateStr)}</div>
                            <div class="epi-sub">${t('detail.episodesCount', { count: eps.length, episodesNoun: episodeNoun(eps.length) })}</div>
                        </div>
                    </div>
                    <div class="episode-list">${epiHtml}</div>
                </div>`;
            }).join('');

            document.getElementById('seriesInfo').textContent = t('detail.seriesInfo', {
                series: seriesName || '',
                count: epis.length,
                episodesNoun: episodeNoun(epis.length)
            });
        }

        (async () => {
            try {
                await loadLang(currentLang);
                await resolveAnalyzedUserName();
                applyStaticText();
                applyTheme(currentTheme);
                await loadDetail();
            } finally {
                if (bootLoading) bootLoading.style.display = 'none';
            }
        })();

        document.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
            btn.addEventListener('click', async () => {
                await loadLang(btn.dataset.lang);
                updateLangSwitcher();
                await loadDetail();
            });
        });

        document.querySelectorAll('[data-theme-value]').forEach(btn => {
            btn.addEventListener('click', () => {
                applyTheme(btn.dataset.themeValue);
            });
        });

        document.getElementById('backBtn').addEventListener('click', goBack);
    </script>
</body>
</html>
